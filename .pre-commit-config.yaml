# This file is maintained centrally at
# https://github.com/giantswarm/github/blob/main/languages/go/.pre-commit-config.yaml

minimum_pre_commit_version: '2.17'
repos:
  # shell scripts
  - repo: https://github.com/detailyang/pre-commit-shell
    rev: '1.0.5'
    hooks:
      - id: shell-lint
        args: [ --format=json ]
        exclude: ".*\\.template"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ".*testdata/.*"
      - id: mixed-line-ending
      - id: trailing-whitespace
        exclude: ".*testdata/.*"

  # Go hooks run the tools on the PATH: gofmt and go from the Go toolchain,
  # goimports and golangci-lint at the versions pre_commit_go.yaml installs.
  # They replace the archived dnephin/pre-commit-golang and keep its behaviour.
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        language: system
        files: '\.go$'
        entry: >-
          bash -c 'command -v gofmt > /dev/null || { echo "gofmt not installed or available in the PATH, see https://go.dev/doc/install"; exit 1; };
          out="$(gofmt -l -w "$@")"; rc=$?;
          [ -z "$out" ] || echo "$out";
          [ $rc -eq 0 ] && [ -z "$out" ]' --
      - id: go-mod-tidy
        name: go mod tidy
        language: system
        files: '\.go$'
        pass_filenames: false
        entry: >-
          bash -c 'if go mod tidy -v 2>&1 | grep -q "updates to go.mod needed"; then exit 1; fi;
          git diff --exit-code go.* > /dev/null 2>&1;
          if [ $? -eq 1 ]; then echo "go.mod or go.sum differs, please re-add it to your commit"; exit 1; fi' --
      - id: golangci-lint
        name: golangci-lint
        language: system
        types: [go]
        pass_filenames: false
        entry: golangci-lint run
        args:
          - -E=gosec
          - -E=goconst
          - -E=govet
          # timeout is needed for CI
          - --timeout=300s
          # List all issues found
          - --max-same-issues=0
          - --max-issues-per-linter=0
      - id: go-imports
        name: go imports
        language: system
        files: '\.go$'
        entry: >-
          bash -c 'command -v goimports > /dev/null || { echo "goimports not installed or available in the PATH, see https://pkg.go.dev/golang.org/x/tools/cmd/goimports"; exit 1; };
          out="$(goimports -l -w "$@")"; rc=$?;
          [ -z "$out" ] || echo "$out";
          [ $rc -eq 0 ] && [ -z "$out" ]' --
        args: [ -local, github.com/giantswarm/operatorkit ]
