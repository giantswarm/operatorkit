name: Add appropriate labels to issue

on:
  issues:
    types: [assigned]

jobs:
  build_user_list:
    name: Get yaml config of GS users
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    # giantswarm/github is private: the App reads the mapping through its
    # single-file permission on the two mapping files, nothing else there.
    - name: Mint App token for the user mapping
      id: app-token
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ secrets.PROJECT_AUTOMATION_CLIENT_ID }}
        private-key: ${{ secrets.PROJECT_AUTOMATION_PRIVATE_KEY }}
        owner: giantswarm
        repositories: github
        permission-single-file: read
    - name: Get user-mapping
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        mkdir -p artifacts
        # The raw media type returns the file itself. No pipe after gh api, so
        # a 404 fails the step under bash -e instead of writing garbage.
        gh api -H "Accept: application/vnd.github.raw" -H "X-GitHub-Api-Version: 2022-11-28" \
          /repos/giantswarm/github/contents/tools/issue-automation/user-mapping.yaml \
          > artifacts/users.yaml
    - name: Upload Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: users
        path: artifacts/users.yaml
        retention-days: 1

  add_label:
    name: Add team label when assigned
    runs-on: ubuntu-latest
    needs: build_user_list
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      id: download-users
      with:
        name: users
    - name: Find team label based on user names
      run: |
        event_assignee=$(cat $GITHUB_EVENT_PATH | jq -r .assignee.login | tr '[:upper:]' '[:lower:]')
        echo "Issue assigned to: ${event_assignee}"

        TEAMS=$(cat ${{steps.download-users.outputs.download-path}}/users.yaml | tr '[:upper:]' '[:lower:]' | yq ".${event_assignee}.teams" -o csv | tr ',' ' ')

        echo "LABEL<<EOF" >> $GITHUB_ENV
        for team in ${TEAMS}; do
          echo "Team: ${team} | Label: team/${team}"
          echo "team/${team}" >> $GITHUB_ENV
        done
        echo "EOF" >> $GITHUB_ENV
    # An App token, unlike GITHUB_TOKEN, lets the `labeled` event it causes run
    # add-to-project-board, which puts the issue on the team's board.
    - name: Mint App token for the label
      id: app-token
      if: ${{ env.LABEL != '' && env.LABEL != 'null' && env.LABEL != null }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      with:
        client-id: ${{ secrets.PROJECT_AUTOMATION_CLIENT_ID }}
        private-key: ${{ secrets.PROJECT_AUTOMATION_PRIVATE_KEY }}
        permission-issues: write
    - name: Apply label to issue
      if: ${{ env.LABEL != '' && env.LABEL != 'null' && env.LABEL != null }}
      uses: actions-ecosystem/action-add-labels@18f1af5e3544586314bbe15c0273249c770b2daf  # v1.1.3
      with:
        github_token: ${{ steps.app-token.outputs.token }}
        labels: |
          ${{ env.LABEL }}
